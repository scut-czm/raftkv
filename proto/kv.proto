syntax = "proto3";
package kv;

option cc_generic_services = true;

// KV 操作类型
enum OperationType{
    OP_PUT = 0;
    OP_DELETE = 1;
    OP_GET = 2; // 线性一致读：走 Raft apply
    OP_SCAN = 3;// 线性一致 Scan：走 Raft apply
}

// KV 操作日志（写入 Raft 日志的内容）
message KvOperation{
    OperationType op=1;
    string key=2;
    string value=3;// Delete 操作不需要 value
}

// ── RPC 请求/响应 ──
message PutRequest{
    string key=1;
    string value=2;
}

message PutResponse{
    bool success=1;
    string redirect =2;// 如果不是 Leader，返回 Leader 地址
    string error=3;
}

message GetRequest{
    string key=1;
    bool linearizable=2;// true = ReadIndex 线性一致读；false = 直接读状态机
}

message GetResponse{
    bool success=1;
    string value=2;// key 存在时返回
    bool found=3;// key 是否存在
    string redirect=4;// 如果不是 Leader，返回 Leader 地址
    string error=5;
}

message DeleteRequest{
    string key=1;
}

message DeleteResponse{
    bool success=1;
    string redirect=2;// 如果不是 Leader，返回 Leader 地址
    string error=3;
}

// KV 键值对（Scan 结果中的单条记录）
message KvPair{
    string key=1;
    string value=2;
}

// Scan 接口
message ScanRequest{
    string start_key=1;// 扫描起始 key（含）
    string end_key=2; // 扫描结束 key（不含），为空表示无上界
    int32 limit=3;// 最多返回条数，0 表示不限制
    bool linearizable=4;// true = ReadIndex 线性一致读
}

message ScanResponse{
    bool success=1;
    repeated KvPair kvs=2;
    string redirect=3;
    string error=4;
}


// KV 服务接口
service KvService{
    rpc Put(PutRequest) returns (PutResponse);
    rpc Get(GetRequest) returns (GetResponse);
    rpc Delete(DeleteRequest) returns (DeleteResponse);
    rpc Scan(ScanRequest) returns (ScanResponse);
}
